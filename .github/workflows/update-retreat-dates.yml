name: Update seminar date
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update seminar date only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<div>🕒 הסמינר הבא: 28–30.1</div>'
          new='<div>🕒 הסמינר הבא: 28–31.1</div>'
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit exact date change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update seminar date to 28-31.1"
          git push
