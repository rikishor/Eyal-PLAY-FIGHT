name: Fix hero sound playback
on:
  push:
    paths:
      - '.github/workflows/swap-hero-video-sound-fixed.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove playback calls from sound handling only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          start=s.index("const heroSection=document.querySelector('.hero');")
          end=s.index("video.addEventListener('pause'",start)
          block=s[start:end]
          block=block.replace("video.play().catch(()=>{});","")
          p.write_text(s[:start]+block+s[end:])
          PY
      - name: Commit only index.html
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix hero sound playback'
          git push
