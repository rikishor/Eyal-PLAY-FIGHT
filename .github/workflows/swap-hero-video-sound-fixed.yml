name: Repair hero sound script syntax
on:
  push:
    paths:
      - '.github/workflows/swap-hero-video-sound-fixed.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair only the hero sound block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="if(soundEnabled){video.muted=!heroVisible;if(heroVisible)}"
          new="if(soundEnabled){video.muted=!heroVisible;}"
          if s.count(old) != 1:
              raise SystemExit(f'Expected one broken sound block, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit only index.html
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Repair hero sound script syntax'
          git push
