name: Reorder value shapes only
on:
  push:
    paths:
      - '.github/workflows/swap-hero-video-sound-fixed.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reorder only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          a=s.index('<div class="values organic-values">')
          b=s.index('</div></div></div></section>',a)
          block=s[a:b]
          import re
          items=re.findall(r'<div class="value (?:listen|play|rewire|conflict)">.*?</div>',block)
          by={re.search(r'class="value (listen|play|rewire|conflict)"',x).group(1):x for x in items}
          if set(by)!={'listen','play','rewire','conflict'}: raise SystemExit('values not found')
          new='<div class="values organic-values">'+by['listen']+by['play']+by['conflict']+by['rewire']
          s=s[:a]+new+s[b:]
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Reorder value shapes only'
          git push
