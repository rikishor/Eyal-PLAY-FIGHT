name: Update hero sound tap behavior
on:
  push:
    paths:
      - '.github/workflows/swap-hero-video-sound-fixed.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update sound toggle only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="const enableSound=()=>{video.muted=false;video.volume=1;const p=video.play();if(p&&typeof p.catch==='function'){p.catch(()=>{video.muted=true;video.play().catch(()=>{});});}};document.addEventListener('pointerdown',enableSound,{capture:true,once:true});document.addEventListener('touchend',enableSound,{capture:true,once:true});"
          new="const toggleSound=()=>{if(video.muted){video.muted=false;video.volume=1;const p=video.play();if(p&&typeof p.catch==='function'){p.catch(()=>{video.muted=true;video.play().catch(()=>{});});}}else{video.muted=true;}};document.addEventListener('pointerdown',toggleSound,{capture:true});"
          if s.count(old) != 1:
              raise SystemExit('Expected exactly one current sound block')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit only index.html
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Toggle hero sound on tap'
          git push
