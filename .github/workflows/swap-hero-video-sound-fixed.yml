name: Decouple hero audio from video playback
on:
  push:
    paths:
      - '.github/workflows/swap-hero-video-sound-fixed.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace only hero sound behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          script_start=s.index("<script>(()=>{const video=document.getElementById('hero-video');")
          script_end=s.index("</script>", script_start)
          new_script="""<script>(()=>{const video=document.getElementById('hero-video');if(!video)return;const heroSection=document.querySelector('.hero');let heroVisible=true;let soundEnabled=false;const audio=new Audio(video.currentSrc||video.src);audio.loop=true;audio.preload='auto';audio.volume=1;audio.muted=true;const syncAudio=()=>{try{if(Number.isFinite(video.currentTime)&&Math.abs((audio.currentTime||0)-video.currentTime)>.35)audio.currentTime=video.currentTime;}catch(e){}};audio.addEventListener('loadedmetadata',syncAudio);const startSound=()=>{if(soundEnabled)return;soundEnabled=true;syncAudio();audio.muted=!heroVisible;const p=audio.play();if(p&&typeof p.catch==='function'){p.catch(()=>{});}};document.addEventListener('pointerdown',startSound,{capture:true,once:true});if(heroSection){const soundObserver=new IntersectionObserver((entries)=>{heroVisible=entries[0].isIntersecting;if(!soundEnabled)return;audio.muted=!heroVisible;if(heroVisible)syncAudio();},{threshold:0});soundObserver.observe(heroSection);}video.addEventListener('seeked',syncAudio);video.addEventListener('playing',syncAudio);const nav=document.querySelector('nav');const hero=document.querySelector('.hero');const syncNav=()=>{if(!nav||!hero)return;nav.classList.toggle('scrolled',window.scrollY>hero.offsetHeight-nav.offsetHeight);};syncNav();window.addEventListener('scroll',syncNav,{passive:true});window.addEventListener('resize',syncNav);})();</script>"""
          p.write_text(s[:script_start]+new_script+s[script_end+9:])
          PY
      - name: Commit only index.html
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Decouple hero audio from video playback'
          git push
