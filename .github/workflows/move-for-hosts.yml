name: Move for-hosts section
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move section only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          start_marker = '<section class="for-hosts">'
          about_marker = '\n<section id="about">'
          media_marker = '\n<section class="media">'
          assert s.count(start_marker) == 1
          assert s.count(about_marker) == 1
          assert s.count(media_marker) == 1
          start = s.index(start_marker)
          about = s.index(about_marker, start)
          block = s[start:about]
          s2 = s[:start] + s[about:]
          media = s2.index(media_marker)
          s3 = s2[:media] + '\n' + block + s2[media:]
          p.write_text(s3)
          PY
      - name: Commit relocation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Move bring PLAY-FIGHT section before media"
          git push
