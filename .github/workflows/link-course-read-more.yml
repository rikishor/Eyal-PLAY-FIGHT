name: Link course card read-more text
on:
  push:
    paths:
      - '.github/workflows/link-course-read-more.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact requested link change
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div style="font-size:16px;color:#b8891e;font-weight:700;text-decoration:underline">לקרוא עוד...</div>'
          new = '<a href="https://eyalbener.wixsite.com/home/play-fight-course" target="_blank" rel="noopener noreferrer" style="font-size:16px;color:#b8891e;font-weight:700;text-decoration:underline">לקרוא עוד...</a>'
          if old not in s:
              raise SystemExit('Target text not found exactly once')
          if s.count(old) != 1:
              raise SystemExit(f'Target found {s.count(old)} times; aborting')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit only the requested site change and remove this one-time workflow
        run: |
          git config user.name "rikishor"
          git config user.email "riki.shor@gmail.com"
          git add index.html
          git commit -m "Link course read-more text to course page"
          git rm .github/workflows/link-course-read-more.yml
          git commit -m "Remove one-time link update workflow"
          git push
