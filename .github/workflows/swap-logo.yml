name: Swap logo
on: push
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sed -i 's/לוגו סופי עדכון אחרון.png/לוגו מספר 2.png/' index.html
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html
          git commit -m 'Use logo number 2' || exit 0
          git push
