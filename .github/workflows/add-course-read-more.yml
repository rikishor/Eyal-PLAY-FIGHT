name: Apply course card read-more text

on:
  push:
    paths:
      - '.github/workflows/add-course-read-more.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply exact requested change
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div>🕒 הקורס הקרוב: 2.11</div></div><a class="btn btn-dark"'
          new = '<div>🕒 הקורס הקרוב: 2.11</div><div style="font-size:16px;color:#b8891e;font-weight:700;text-decoration:underline">לקרוא עוד...</div></div><a class="btn btn-dark"'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one target, found {count}; no change made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit only the requested site change and remove this one-time workflow
        run: |
          git config user.name "OpenAI Site Update"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/add-course-read-more.yml
          git add index.html
          git commit -m "Add read-more text under upcoming course date"
          git push origin main
