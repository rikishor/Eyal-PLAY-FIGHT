name: Add retreat read-more link
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact requested change
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<div style="margin-top:4px">📍 מיקום: יער המאכל, בית לחם הגלילית</div></div><a class="btn btn-dark"'
          new = '<div style="margin-top:4px">📍 מיקום: יער המאכל, בית לחם הגלילית</div><a href="https://eyalbener.wixsite.com/home/alternate-kippur-retreat" target="_blank" rel="noopener noreferrer" style="font-size:16px;color:#b8891e;font-weight:700;text-decoration:underline">לקרוא עוד על ריטריט כיפור...</a></div><a class="btn btn-dark"'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one match, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit only requested site change and remove this one-time workflow
        run: |
          rm .github/workflows/add-retreat-read-more.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-retreat-read-more.yml
          git commit -m "Add retreat read-more link under location"
          git push
# trigger
