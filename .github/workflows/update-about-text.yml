name: Update about text
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace about body text only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          start='<div class="about-copy"><div class="eyebrow">על איל</div><h2 class="section-title display">הגוף יודע<br>לפני שאנחנו יודעים.</h2>'
          chips='<div class="chips">'
          assert s.count(start)==1
          a=s.index(start)+len(start)
          b=s.index(chips,a)
          new='''<p>היי, אני איל בנר, בן 47, ומתגורר עם משפחתי בקיבוץ בית קשת שבגליל התחתון.</p><p>מאז שאני זוכר את עצמי, אני תלמיד של הגוף. כדורגל בקיבוץ, אומנויות לחימה, קונג־פו וטאי־צ׳י, ובהמשך גם קונטקט אימפרוביזציה ועולמות נוספים של תנועה ומפגש. במשך שנים הגוף היה עבורי מקום טבעי וחזק — מקום שידעתי לנוע בו, להקשיב לו וללמוד דרכו.</p><p>החיבור לעולם הרגשי היה עבורי פחות מובן מאליו. גדלתי עם תפיסה שבה לא לכל רגש ולא לכל ביטוי רגשי הייתה אותה לגיטימציה.</p><p>לקראת גיל 40 עברתי תקופה של משבר. התגרשתי, סגרתי עסק מצליח ופניתי למה שהיה חי בי מאז ומתמיד — החיבור לגוף. דווקא שם התחלתי לגלות שהגוף, שהיה חלק כל כך מרכזי בחיי, יכול להיות גם שער אל העולם הרגשי. לא רק גוף שנע, פועל ומתמודד — אלא גוף שמרגיש, זוכר, מחזיק ומספר.</p><p>דרך החיבור הזה נפתחה עבורי האפשרות לתת יותר מקום ולגיטימציה למה שאני מרגיש, לבטא אותו ולהישאר איתו — ולגלות עד כמה הגוף והנפש מדברים זה עם זה כל הזמן.</p><p>המפגש בין שני העולמות האלה הפך עם הזמן ללב הדרך המקצועית שלי. המשכתי ללמוד ולהעמיק בפסיכותרפיה דרך הגוף – אומניתרפי, בקונסטלציה משפחתית ובגישות נוספות.</p><p>היום אני מבקש ליצור מרחבים שבהם גוף ורגש יכולים להיפגש — ושבהם יש מקום גם לכוח וגם לרכות, גם להקשבה וגם לקונטרה, גם למשחק וגם לעומק.</p><p>מתוך החקירה הזאת צמחה גם העבודה שלי עם PLAY-FIGHT — מרחב שבו אפשר לפגוש דרך הגוף את הכוחות שפועלים בתוכנו ובינינו, לשחק איתם ולגלות מה מתאפשר.</p><p>אם משהו בדרך שלי פוגש אתכם, מסקרן אתכם או מרגיש מוכר — אני מזמין אתכם לבוא לפגוש אותי, ובמפגש הזה לפגוש גם את עצמכם — דרך הגוף, דרך המשחק ודרך מה שעוד רוצה להתגלות.</p>'''
          s2=s[:a]+new+s[b:]
          p.write_text(s2)
          PY
      - name: Commit exact about text update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update about section text"
          git push
