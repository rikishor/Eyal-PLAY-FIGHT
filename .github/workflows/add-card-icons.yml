name: Add card detail icons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-card-icons.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add icons only to existing card detail lines
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('<div>משך: 3–4 שעות</div>', '<div>⏳ משך: 3–4 שעות</div>'),
              ('<div>המועדים הקרובים: 14.9, 5.10</div>', '<div>🕒 המועדים הקרובים: 14.9, 5.10</div>'),
              ('<div>מיקום: סטודיו תנע, פרדס חנה</div>', '<div>📍 מיקום: סטודיו תנע, פרדס חנה</div>'),
              ('<div>10–30 מפגשים לאורך 3–6 חודשים</div>', '<div>⏳ 10–30 מפגשים לאורך 3–6 חודשים</div>'),
              ('<div>מיקום: סטודיו בפרדס חנה</div>', '<div>📍 מיקום: סטודיו בפרדס חנה</div>'),
              ('<div>הקורס הקרוב: 2.11</div>', '<div>🕒 הקורס הקרוב: 2.11</div>'),
              ('<div>משך: 2–3 ימים</div>', '<div>⏳ משך: 2–3 ימים</div>'),
              ('<div style="margin-top:4px">המועדים הקרובים:</div>', '<div style="margin-top:4px">🕒 המועדים הקרובים:</div>'),
              ('<div style="margin-top:4px">מיקום: יער המאכל, בית לחם הגלילית</div>', '<div style="margin-top:4px">📍 מיקום: יער המאכל, בית לחם הגלילית</div>'),
              ('<div>ימי א׳: 20:30–22:30</div>', '<div>🕒 ימי א׳: 20:30–22:30</div>'),
              ('<div>מיקום: מרכז BEING · פרדס חנה</div>', '<div>📍 מיקום: מרכז BEING · פרדס חנה</div>'),
              ('<div>מיקום:</div>', '<div>📍 מיקום:</div>'),
              ('<div>זמנים: בתיאום מראש</div>', '<div>🕒 זמנים: בתיאום מראש</div>'),
              ('<div>משך הסמינר: 3 ימים</div>', '<div>⏳ משך הסמינר: 3 ימים</div>'),
              ('<div>מיקום: חוות ורטיגו · נתיב הל״ה</div>', '<div>📍 מיקום: חוות ורטיגו · נתיב הל״ה</div>'),
              ('<div>הסמינר הבא: 28–30.1</div>', '<div>🕒 הסמינר הבא: 28–30.1</div>'),
          ]
          original = s
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match for {old!r}, found {count}')
              s = s.replace(old, new, 1)
          if s == original:
              raise SystemExit('No changes made')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit only the requested site change
        run: |
          rm .github/workflows/add-card-icons.yml
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-card-icons.yml
          git diff --cached --check
          git commit -m "Add icons to card details only"
          git push origin main
