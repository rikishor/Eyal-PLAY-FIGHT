name: Resize header logo
on:
  push:
    paths:
      - '.github/workflows/resize-logo.yml'
permissions:
  contents: write
jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resize logo only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='width:128px;height:auto;display:block;z-index:3'
          new='width:92px;height:auto;display:block;z-index:3'
          if old not in s:
              raise SystemExit('desktop logo width pattern not found')
          s=s.replace(old,new,1)
          old_mobile='.playfight-mark{width:94px}'
          new_mobile='.playfight-mark{width:68px}'
          if old_mobile not in s:
              raise SystemExit('mobile logo width pattern not found')
          s=s.replace(old_mobile,new_mobile,1)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fit PLAY FIGHT logo inside header'
          git push
