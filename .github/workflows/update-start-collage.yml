name: Replace first media video only
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace only first media video
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<div class="embed"><video src="סרטון לאתר.mp4" controls playsinline style="width:100%;height:430px;border:0;border-radius:18px;display:block;background:#000"></video></div>'
          new = '<div class="embed"><video src="סרטון 2 לאתר.mp4" controls playsinline style="width:100%;height:430px;border:0;border-radius:18px;display:block;background:#000"></video></div>'
          if s.count(old) != 1:
              raise SystemExit('Expected exactly one first-video target; aborting without changes.')
          p.write_text(s.replace(old, new, 1))
          PY
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Replace first media video only
          file_pattern: index.html
