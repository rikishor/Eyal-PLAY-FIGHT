name: Remove workshop video caption
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove only the workshop video caption
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<div class="embed-caption">מתוך סדנת PLAY-FIGHT</div>'
          if old not in s:
              raise SystemExit(0)
          if s.count(old) != 1:
              raise SystemExit('Expected exactly one workshop video caption; aborting without changes.')
          p.write_text(s.replace(old,'',1))
          PY
      - name: Commit exact change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove workshop video caption"
          git push
