name: Move media after routes
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move only the media section
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          media_start=s.index('<section class="media">')
          media_end=s.index('</section>', media_start)+len('</section>')
          media=s[media_start:media_end]
          rest=s[:media_start]+s[media_end:]
          marker='<section class="for-hosts">'
          pos=rest.index(marker)
          new=rest[:pos]+media+'\n'+rest[pos:]
          if new==s:
              raise SystemExit(0)
          p.write_text(new)
          PY
      - name: Commit exact change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Move media section after how-to-start"
          git push
