name: Update start collage
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace only the image before How to Start
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<img src="playfight-collage.webp" alt="" style="width:100%;height:auto;display:block;border-radius:24px;margin:0 0 45px">'
          new='<img src="קולאז לאתר.png" alt="" style="width:100%;height:auto;display:block;border-radius:24px;margin:0 0 45px">'
          if old not in s:
              print('Target already changed or not found; no changes made.')
              raise SystemExit(0)
          if s.count(old) != 1:
              raise SystemExit('Expected exactly one target image; aborting without changes.')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit exact change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use uploaded collage before How to Start"
          git push
