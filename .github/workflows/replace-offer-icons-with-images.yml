name: Replace offer icons with images
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact requested image replacements
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          replacements = [
            ('<div class="offer-icon">↗</div>', '<img src="https://www.bodymindcentering.com/wp-content/uploads/2019/01/somatic_education_australasia_body_mind_centering-1024x683.jpg" alt="" style="width:100%;height:120px;object-fit:cover;border-radius:16px;display:block">'),
            ('<div class="offer-icon">∞</div>', '<img src="https://classpass-res.cloudinary.com/image/upload/f_auto/q_auto/hqa47wxgweigpumxyjfn.jpg" alt="" style="width:100%;height:120px;object-fit:cover;border-radius:16px;display:block">'),
            ('<div class="offer-icon">△</div>', '<img src="https://images.squarespace-cdn.com/content/v1/6680897dc772980f7db6af83/bea0e791-51b1-484b-bae7-0caf958b644d/JK7C9197.jpg" alt="" style="width:100%;height:120px;object-fit:cover;border-radius:16px;display:block">'),
            ('<div class="offer-icon">◌</div>', '<img src="https://classpass-res.cloudinary.com/image/upload/f_auto/q_auto/hqa47wxgweigpumxyjfn.jpg" alt="" style="width:100%;height:120px;object-fit:cover;border-radius:16px;display:block">'),
            ('<div class="offer-icon">◇</div>', '<img src="https://www.danse-et-therapie.com/nathaliechazeaubodymind.jpg" alt="" style="width:100%;height:120px;object-fit:cover;border-radius:16px;display:block">'),
            ('<div class="offer-icon">●</div>', '<img src="https://www.bodymindcentering.com/wp-content/uploads/2019/01/somatic_education_australasia_body_mind_centering-1024x683.jpg" alt="" style="width:100%;height:120px;object-fit:cover;border-radius:16px;display:block">'),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'Expected exactly one match for {old!r}, found {s.count(old)}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit only requested site change and remove this one-time workflow
        run: |
          rm .github/workflows/replace-offer-icons-with-images.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/replace-offer-icons-with-images.yml
          git commit -m "Replace offer icons with landscape images"
          git push
